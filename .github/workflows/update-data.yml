name: Update Map Data

on:
  schedule:
    - cron: '0 */6 * * *'  # Каждые 6 часов
  workflow_dispatch:       # Ручной запуск

jobs:
  update:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Права на коммит
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Run update script
        env:
          BITRIX_WEBHOOK: ${{ secrets.BITRIX_WEBHOOK }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
        run: |
          python update_data.py
      
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Проверяем изменения (игнорируем config.js)
          if git diff --quiet && git diff --cached --quiet; then
            echo "📭 Нет изменений для коммита"
            exit 0
          fi
          
          # Добавляем только нужные файлы (НЕ config.js!)
          git add data/addresses.json
          git add data/geocode_cache.json
          
          # Проверяем, есть ли что коммитить
          if git diff --cached --quiet; then
            echo "📭 Нет изменений в отслеживаемых файлах"
            exit 0
          fi
          
          git commit -m "🔄 Auto-update map data [skip ci]"
          
          # Push с rebase
          git pull --rebase origin main || true
          git push origin HEAD:main
